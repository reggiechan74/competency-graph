<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 306" width="752" height="306" role="img" aria-label="A small competency graph. Lease negotiation is a specialisation of Leasing, which is a specialisation of the Real property domain, each joined by a broader link. A tool, Lease software, is related to Leasing. A role as leasing manager demonstrates Leasing and sits in the Real estate sector. A project that is part of that role demonstrates Lease negotiation as led work. Leasing names a framework competency, Leasing/letting, which is a row in a framework’s file and not a note.">
  <title>A small competency graph. Lease negotiation is a specialisation of Leasing, which is a specialisation of the Real property domain, each joined by a broader link. A tool, Lease software, is related to Leasing. A role as leasing manager demonstrates Leasing and sits in the Real estate sector. A project that is part of that role demonstrates Lease negotiation as led work. Leasing names a framework competency, Leasing/letting, which is a row in a framework’s file and not a note.</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 330" width="752" height="330" role="img" aria-label="How a supported level is worked out. Two projects inside a role at organisation A collapse into one unit; an engagement at organisation B is a second unit and a credential a third. All three demonstrate Lease negotiation and roll up to Leasing and to Real property. For Lease negotiation the counts are three units, two of them led, two organisations, about ten years of work and about four years led. The level rule gives a supported level of L2 Practitioner, which is compared with the claimed level stored in the note, L3 Advanced.">
  <title>How a supported level is worked out. Two projects inside a role at organisation A collapse into one unit; an engagement at organisation B is a second unit and a credential a third. All three demonstrate Lease negotiation and roll up to Leasing and to Real property. For Lease negotiation the counts are three units, two of them led, two organisations, about ten years of work and about four years led. The level rule gives a supported level of L2 Practitioner, which is compared with the claimed level stored in the note, L3 Advanced.</title>
